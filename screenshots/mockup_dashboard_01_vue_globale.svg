<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 900" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="kpiBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2E86AB"/><stop offset="1" stop-color="#1F618D"/>
    </linearGradient>
    <linearGradient id="kpiMagenta" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A23B72"/><stop offset="1" stop-color="#7D2A56"/>
    </linearGradient>
    <linearGradient id="kpiOrange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F18F01"/><stop offset="1" stop-color="#C57701"/>
    </linearGradient>
    <linearGradient id="kpiGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06A77D"/><stop offset="1" stop-color="#048461"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/></filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1366" height="900" fill="#F5F5F5"/>

  <!-- ─── TITLE BAR ─── -->
  <rect x="0" y="0" width="1366" height="80" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="32" y="38" font-size="22" font-weight="800" fill="#1F2937">🏥 PILOTAGE DE L'ACTIVITÉ HOSPITALIÈRE</text>
  <text x="32" y="62" font-size="13" font-style="italic" fill="#6B7280">Vue Globale · Direction Générale · Année 2024</text>
  <text x="1334" y="42" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="end">DASHBOARD 1 / 3</text>
  <text x="1334" y="60" font-size="10" fill="#9CA3AF" text-anchor="end">Martine Ouedraogo · Master 1 Lyon 2</text>

  <!-- ─── FILTER ROW ─── -->
  <rect x="0" y="80" width="1366" height="40" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
  <text x="32" y="105" font-size="11" font-weight="700" fill="#6B7280">FILTRES :</text>
  <rect x="100" y="90" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="110" y="106" font-size="11" fill="#374151">Année : 2024 ▾</text>
  <rect x="232" y="90" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="242" y="106" font-size="11" fill="#374151">Service : Tous ▾</text>
  <rect x="404" y="90" width="160" height="22" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="414" y="106" font-size="11" fill="#374151">Spécialité : Toutes ▾</text>

  <!-- ─── KPI ROW (4 cards) ─── -->
  <!-- KPI 1 - Consultations -->
  <rect x="20" y="140" width="320" height="130" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="20" y="140" width="4" height="130" rx="2" fill="url(#kpiBlue)"/>
  <text x="40" y="170" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">📊 CONSULTATIONS</text>
  <text x="40" y="220" font-size="44" font-weight="800" fill="#2E86AB">10 000</text>
  <text x="40" y="245" font-size="11" fill="#6B7280">Total cumulé</text>
  <text x="320" y="245" font-size="11" font-weight="700" fill="#06A77D" text-anchor="end">↑ +12,3 %</text>

  <!-- KPI 2 - Coût Total -->
  <rect x="356" y="140" width="320" height="130" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="356" y="140" width="4" height="130" rx="2" fill="url(#kpiMagenta)"/>
  <text x="376" y="170" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">💰 COÛT TOTAL</text>
  <text x="376" y="220" font-size="44" font-weight="800" fill="#A23B72">2,71 M€</text>
  <text x="376" y="245" font-size="11" fill="#6B7280">Cumul annuel</text>
  <text x="656" y="245" font-size="11" font-weight="700" fill="#06A77D" text-anchor="end">↑ +8,1 %</text>

  <!-- KPI 3 - Durée Moyenne -->
  <rect x="692" y="140" width="320" height="130" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="692" y="140" width="4" height="130" rx="2" fill="url(#kpiOrange)"/>
  <text x="712" y="170" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">⏱️ DURÉE MOYENNE</text>
  <text x="712" y="220" font-size="44" font-weight="800" fill="#F18F01">65 min</text>
  <text x="712" y="245" font-size="11" fill="#6B7280">Par consultation</text>
  <text x="992" y="245" font-size="11" font-weight="700" fill="#9CA3AF" text-anchor="end">→ Stable</text>

  <!-- KPI 4 - Patients -->
  <rect x="1028" y="140" width="320" height="130" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="1028" y="140" width="4" height="130" rx="2" fill="url(#kpiGreen)"/>
  <text x="1048" y="170" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">👥 PATIENTS</text>
  <text x="1048" y="220" font-size="44" font-weight="800" fill="#06A77D">186</text>
  <text x="1048" y="245" font-size="11" fill="#6B7280">Patients uniques</text>
  <text x="1328" y="245" font-size="11" font-weight="700" fill="#06A77D" text-anchor="end">↑ +5,2 %</text>

  <!-- ─── EVOLUTION CHART (line) ─── -->
  <rect x="20" y="290" width="1328" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="40" y="320" font-size="14" font-weight="700" fill="#1F2937">📈 Évolution mensuelle du coût des consultations</text>
  <text x="40" y="340" font-size="11" fill="#9CA3AF">12 derniers mois — granularité mensuelle</text>

  <!-- Y-axis lines -->
  <line x1="80" y1="380" x2="1330" y2="380" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="80" y1="430" x2="1330" y2="430" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="80" y1="480" x2="1330" y2="480" stroke="#F3F4F6" stroke-width="1"/>
  <line x1="80" y1="530" x2="1330" y2="530" stroke="#E5E7EB" stroke-width="1"/>
  <text x="70" y="384" font-size="9" fill="#9CA3AF" text-anchor="end">300K€</text>
  <text x="70" y="434" font-size="9" fill="#9CA3AF" text-anchor="end">200K€</text>
  <text x="70" y="484" font-size="9" fill="#9CA3AF" text-anchor="end">100K€</text>
  <text x="70" y="534" font-size="9" fill="#9CA3AF" text-anchor="end">0€</text>

  <!-- Line path -->
  <path d="M 110 470 L 215 445 L 320 458 L 425 420 L 530 432 L 635 405 L 740 390 L 845 410 L 950 395 L 1055 380 L 1160 410 L 1265 395"
        fill="none" stroke="#2E86AB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area under -->
  <path d="M 110 470 L 215 445 L 320 458 L 425 420 L 530 432 L 635 405 L 740 390 L 845 410 L 950 395 L 1055 380 L 1160 410 L 1265 395 L 1265 530 L 110 530 Z"
        fill="#2E86AB" fill-opacity="0.08"/>
