  <g fill="#2E86AB">
    <circle cx="110" cy="470" r="4"/><circle cx="215" cy="445" r="4"/><circle cx="320" cy="458" r="4"/>
    <circle cx="425" cy="420" r="4"/><circle cx="530" cy="432" r="4"/><circle cx="635" cy="405" r="4"/>
    <circle cx="740" cy="390" r="4"/><circle cx="845" cy="410" r="4"/><circle cx="950" cy="395" r="4"/>
    <circle cx="1055" cy="380" r="4"/><circle cx="1160" cy="410" r="4"/><circle cx="1265" cy="395" r="4"/>
  </g>
  <!-- X labels -->
  <g font-size="9" fill="#9CA3AF" text-anchor="middle">
    <text x="110" y="550">Jan</text><text x="215" y="550">Fév</text><text x="320" y="550">Mar</text>
    <text x="425" y="550">Avr</text><text x="530" y="550">Mai</text><text x="635" y="550">Juin</text>
    <text x="740" y="550">Juil</text><text x="845" y="550">Août</text><text x="950" y="550">Sep</text>
    <text x="1055" y="550">Oct</text><text x="1160" y="550">Nov</text><text x="1265" y="550">Déc</text>
  </g>

  <!-- ─── BOTTOM ROW : 2 charts ─── -->
  <!-- Top 5 Services -->
  <rect x="20" y="590" width="652" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="40" y="620" font-size="14" font-weight="700" fill="#1F2937">🏆 Top 5 Services par activité</text>
  <text x="40" y="640" font-size="11" fill="#9CA3AF">Nombre de consultations · classement décroissant</text>

  <!-- Bars -->
  <g font-size="10" fill="#374151">
    <text x="40" y="670">Cardiologie</text>
    <rect x="180" y="660" width="430" height="14" rx="2" fill="#2E86AB"/>
    <text x="620" y="670" font-weight="700" fill="#1F2937">2 480</text>

    <text x="40" y="700">Dermatologie</text>
    <rect x="180" y="690" width="365" height="14" rx="2" fill="#2E86AB" fill-opacity="0.85"/>
    <text x="555" y="700" font-weight="700" fill="#1F2937">2 105</text>

    <text x="40" y="730">Généraliste</text>
    <rect x="180" y="720" width="305" height="14" rx="2" fill="#2E86AB" fill-opacity="0.7"/>
    <text x="495" y="730" font-weight="700" fill="#1F2937">1 760</text>

    <text x="40" y="760">Radiologie</text>
    <rect x="180" y="750" width="245" height="14" rx="2" fill="#2E86AB" fill-opacity="0.55"/>
    <text x="435" y="760" font-weight="700" fill="#1F2937">1 410</text>

    <text x="40" y="790">Pédiatrie</text>
    <rect x="180" y="780" width="195" height="14" rx="2" fill="#2E86AB" fill-opacity="0.4"/>
    <text x="385" y="790" font-weight="700" fill="#1F2937">1 125</text>
  </g>

  <!-- Patients par tranche d'âge -->
  <rect x="696" y="590" width="652" height="280" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="716" y="620" font-size="14" font-weight="700" fill="#1F2937">👥 Patients par Tranche d'âge</text>
  <text x="716" y="640" font-size="11" fill="#9CA3AF">Distribution démographique</text>

  <g>
    <text x="716" y="670" font-size="10" fill="#374151">0-17 ans</text>
    <rect x="820" y="660" width="190" height="14" rx="2" fill="#A23B72" fill-opacity="0.4"/>
    <text x="1020" y="670" font-size="10" font-weight="700" fill="#1F2937">28 (15%)</text>

    <text x="716" y="700" font-size="10" fill="#374151">18-35 ans</text>
    <rect x="820" y="690" width="320" height="14" rx="2" fill="#A23B72" fill-opacity="0.65"/>
    <text x="1150" y="700" font-size="10" font-weight="700" fill="#1F2937">52 (28%)</text>

    <text x="716" y="730" font-size="10" fill="#374151">36-50 ans</text>
    <rect x="820" y="720" width="380" height="14" rx="2" fill="#A23B72" fill-opacity="0.85"/>
    <text x="1210" y="730" font-size="10" font-weight="700" fill="#1F2937">61 (33%)</text>

    <text x="716" y="760" font-size="10" fill="#374151">51-65 ans</text>
    <rect x="820" y="750" width="200" height="14" rx="2" fill="#A23B72" fill-opacity="0.55"/>
    <text x="1030" y="760" font-size="10" font-weight="700" fill="#1F2937">31 (17%)</text>

    <text x="716" y="790" font-size="10" fill="#374151">65+ ans</text>
    <rect x="820" y="780" width="90" height="14" rx="2" fill="#A23B72" fill-opacity="0.3"/>
    <text x="920" y="790" font-size="10" font-weight="700" fill="#1F2937">14 (7%)</text>
  </g>

  <!-- ─── FOOTER ─── -->
  <text x="1334" y="892" font-size="9" font-style="italic" fill="#9CA3AF" text-anchor="end">
    Hospital BI Warehouse · Vue Globale · Université Lumière Lyon 2 · 2026
  </text>
</svg>
